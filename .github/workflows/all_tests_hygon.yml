name: hygon_tests

on:
  workflow_dispatch:
    inputs:
      run_functional_tests:
        description: Run BW1000 functional and benchmark tests
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml

  run_tests:
    needs: lint
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: hygon
      run_functional_tests: ${{ inputs.run_functional_tests }}
