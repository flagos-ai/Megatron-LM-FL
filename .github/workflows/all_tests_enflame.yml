name: enflame_tests

on:
  workflow_dispatch: # Allows manual triggering
    inputs:
      run_unit_tests:
        description: 'Run unit tests'
        required: false
        type: boolean
        default: true
      run_functional_tests:
        description: 'Run functional tests'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml

  run_tests:
    needs: lint
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: enflame
      run_unit_tests: ${{ inputs.run_unit_tests }}
      run_functional_tests: ${{ inputs.run_functional_tests }}
