# Unified CI entry point for Megatron-LM-FL.
#
# Pipeline: lint → generate-matrix → platform-pipeline (matrix) → ci-complete
#
# Platform discovery is config-driven: generate_matrix.py scans
# .github/configs/*.yml for platform names, then on pull_request events
# intersects the changed-file list against per-platform paths_watch so
# only affected platforms run.  All other events run the full matrix.

name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, devops]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      plan_status: ${{ steps.plan.outputs.plan_status }}
      selection: ${{ steps.plan.outputs.selection }}
      scope: ${{ steps.plan.outputs.scope }}
      catalog_completeness: ${{ steps.plan.outputs.catalog_completeness }}
      required_plan_status: ${{ steps.plan.outputs.required_plan_status }}
      allow_catalog_partial: ${{ steps.plan.outputs.allow_catalog_partial }}
      expected_unit_groups: ${{ steps.plan.outputs.expected_unit_groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matrix dependencies
        run: python -m pip install --quiet PyYAML==6.0.3
      - name: Compute platform matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python .github/scripts/ci/generate_matrix.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --configs-dir .github/configs \
            >> "$GITHUB_OUTPUT"

      # PR runs use affected selection from the diff. Schedule runs use
      # configured selection: every active logical group each enabled platform
      # can execute, ignoring the diff. Planned catalog groups are reported
      # separately and never enter the nightly matrix. A directly affected
      # planned group or unknown path still blocks PR execution.
      - name: Generate unit test plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PLATFORMS: ${{ steps.matrix.outputs.platforms }}
        run: |
          python .github/scripts/ci/generate_test_plan.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --platforms "$PLATFORMS" \
            --output unit-test-plan.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload unit test plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-plan
          path: unit-test-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.unit_matrix) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      expected_unit_groups: ${{ toJson(matrix.groups) }}
      config_identity: ${{ toJson(matrix.config_identity) }}
      plan_hash: ${{ needs.generate-matrix.outputs.plan_hash }}

  ci-complete:
    name: CI Complete
    needs: [lint, generate-matrix, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI gate scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Keep the gate independent of test containers and platform dependencies.
      - name: Verify required CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          PLATFORMS: ${{ needs.generate-matrix.outputs.platforms }}
          PLAN_STATUS: ${{ needs.generate-matrix.outputs.plan_status }}
          SCOPE: ${{ needs.generate-matrix.outputs.scope }}
          REQUIRED_PLAN_STATUS: ${{ needs.generate-matrix.outputs.required_plan_status }}
          ALLOW_CATALOG_PARTIAL: ${{ needs.generate-matrix.outputs.allow_catalog_partial }}
          CATALOG_COMPLETENESS: ${{ needs.generate-matrix.outputs.catalog_completeness }}
          PLAN_HASH: ${{ needs.generate-matrix.outputs.plan_hash }}
          PIPELINE_RESULT: ${{ needs.platform-pipeline.result }}
        run: |
          python3 - <<'PY'
          import json
          import os

          if os.environ['LINT_RESULT'] != 'success':
              raise SystemExit('Lint failed, was cancelled, or did not run')
          if os.environ['MATRIX_RESULT'] != 'success':
              raise SystemExit('Platform matrix generation did not succeed')
          platforms = json.loads(os.environ['PLATFORMS'])
          if not isinstance(platforms, list) or any(
              not isinstance(platform, str) or not platform for platform in platforms
          ):
              raise SystemExit('Invalid platform matrix')
          if platforms:
              allowed = json.loads(os.environ.get('REQUIRED_PLAN_STATUS') or '["ready"]')
              if os.environ['PLAN_STATUS'] not in allowed:
                  raise SystemExit(
                      'Unit plan status is not allowed by the project gate policy: '
                      f"{os.environ['PLAN_STATUS']} not in {allowed}"
                  )
              if (
                  os.environ.get('CATALOG_COMPLETENESS') == 'partial'
                  and os.environ.get('ALLOW_CATALOG_PARTIAL', '').lower() != 'true'
              ):
                  raise SystemExit('Project gate policy does not allow a partial catalog')
              if not os.environ['PLAN_HASH'].startswith('sha256:'):
                  raise SystemExit('Unit plan hash is missing')
          expected = 'success' if platforms else 'skipped'
          if os.environ['PIPELINE_RESULT'] != expected:
              raise SystemExit(f'Platform pipeline must be {expected}')
          print('All required CI checks passed')
          PY

      - name: Download unit test plan
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        uses: actions/download-artifact@v4
        with:
          name: unit-test-plan
          path: unit-test-plan

      - name: Download unit execution attestations
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: unit-results

      - name: Verify unit plan across platforms
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        env:
          PLAN_HASH: ${{ needs.generate-matrix.outputs.plan_hash }}
          EXPECTED_UNIT_GROUPS: ${{ needs.generate-matrix.outputs.expected_unit_groups }}
          UNIT_MATRIX: ${{ needs.generate-matrix.outputs.unit_matrix }}
          REQUIRED_PLAN_STATUS: ${{ needs.generate-matrix.outputs.required_plan_status }}
          ALLOW_CATALOG_PARTIAL: ${{ needs.generate-matrix.outputs.allow_catalog_partial }}
        run: |
          set -euo pipefail
          catalog_flag=()
          if [ "$ALLOW_CATALOG_PARTIAL" = true ]; then
            catalog_flag+=(--allow-catalog-partial)
          fi
          python3 .github/scripts/ci/flagcicd_gate.py \
            --plan unit-test-plan/unit-test-plan.json \
            --attestation-root unit-results \
            --expected-hash "$PLAN_HASH" \
            --expected-groups "$EXPECTED_UNIT_GROUPS" \
            --matrix "$UNIT_MATRIX" \
            --required-status "$REQUIRED_PLAN_STATUS" \
            "${catalog_flag[@]}"
