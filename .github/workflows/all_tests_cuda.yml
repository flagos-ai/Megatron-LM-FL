name: cuda_tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  te_fl_prepare:
    # CUDA is the only platform that builds the TE-FL native wheel in CI.
    uses: ./.github/workflows/prepare_te_fl.yml
    with:
      platform: cuda

  run_tests:
    needs: te_fl_prepare
    # Package manager and environment settings are read from .github/configs/cuda.yml
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: cuda
      run_unit_tests: true
      run_functional_tests: true
      te_fl_prepare: true
      te_fl_cache_key: ${{ needs.te_fl_prepare.outputs.cache_key }}

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Tests workflow failed"
            exit 1
          fi
          echo "✅ All tests passed!"
