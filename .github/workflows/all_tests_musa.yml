name: s5000_tests

on:
  workflow_dispatch:
    inputs:
      image_override:
        description: >-
          Optional image override for this run. Replaces the configured ci_image.
        required: false
        type: string
        default: ''
      run_unit_tests:
        description: 'Run unit tests'
        required: false
        type: boolean
        default: true
      run_functional_tests:
        description: 'Run functional tests'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml

  run_tests:
    needs: lint
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: musa
      run_unit_tests: ${{ inputs.run_unit_tests }}
      run_functional_tests: ${{ inputs.run_functional_tests }}
      image_override: ${{ inputs.image_override }}
