name: Common CI Checks

on:
  workflow_call:
    inputs:
      source_ref: {required: false, type: string, default: ''}
      base_ref: {required: false, type: string, default: main}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install --quiet pre-commit==4.2.0 PyYAML==6.0.3 coverage==7.6.1 pytest==8.3.5 requests==2.32.5 click==8.1.8
      - name: Check changed files
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
        run: |
          pre-commit run --show-diff-on-failure \
            --from-ref "$(git merge-base "origin/$BASE_REF" HEAD)" --to-ref HEAD
      - name: Test CI helpers
        run: |
          python -m unittest discover -s .github/scripts/ci -p 'test_*.py'
          python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
