name: Common All Tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform configuration name
      run_unit_tests:
        required: false
        type: boolean
        default: true
        description: Whether to run unit tests in this workflow
      run_functional_tests:
        required: false
        type: boolean
        default: true
        description: Whether to run functional tests in this workflow
      te_fl_prepare:
        required: false
        type: boolean
        default: false
        description: Whether the caller prepared a TE-FL wheel for test jobs
      te_fl_cache_key:
        required: false
        type: string
        default: ''
        description: Cache key for the caller-prepared TE-FL wheel
      image_override:
        required: false
        type: string
        default: ''
        description: Optional image override for this run

jobs:
  checkout_and_config:
    name: checkout_and_config
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.config.outputs.image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      container_volumes: ${{ steps.config.outputs.container_volumes }}
      container_options: ${{ steps.config.outputs.container_options }}
      device_types: ${{ steps.config.outputs.device_types }}
      setup_script: ${{ steps.config.outputs.setup_script }}
      unit_nproc_per_node: ${{ steps.config.outputs.unit_nproc_per_node }}
      train_test_matrix: ${{ steps.config.outputs.train_test_matrix }}
      unit_test_groups: ${{ steps.config.outputs.unit_test_groups }}
      unit_pytest_extra_args: ${{ steps.config.outputs.unit_pytest_extra_args }}
      ignored_tests: ${{ steps.config.outputs.ignored_tests }}
      te_fl_runtime_environment: ${{ steps.config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ steps.config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ steps.config.outputs.te_fl_runtime_pip_packages }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
            sudo chmod 0755 /usr/local/bin/yq
          fi
          yq --version

      - name: Read and validate platform configuration
        id: config
        env:
          PLATFORM: ${{ inputs.platform }}
          IMAGE_OVERRIDE: ${{ inputs.image_override }}
          RUN_UNIT_TESTS: ${{ inputs.run_unit_tests }}
          RUN_FUNCTIONAL_TESTS: ${{ inputs.run_functional_tests }}
        run: |
          set -euo pipefail

          config_file=".github/configs/${PLATFORM}.yml"
          if [ ! -f "$config_file" ]; then
            echo "::error::Platform configuration not found: $config_file" >&2
            exit 1
          fi

          image=$(yq -r '.ci_image // ""' "$config_file")
          if [ -n "$IMAGE_OVERRIDE" ]; then
            image="$IMAGE_OVERRIDE"
          fi
          if [ -z "$image" ]; then
            echo "::error::ci_image is required in $config_file" >&2
            exit 1
          fi

          runs_on=$(yq -o=json -I=0 '.runner_labels // []' "$config_file")
          volumes=$(yq -o=json -I=0 '.container_volumes // []' "$config_file")
          options=$(yq -r '.container_options // ""' "$config_file")
          devices=$(yq -o=json -I=0 '.device_types // []' "$config_file")
          setup_script=$(yq -r '.setup_script // ""' "$config_file")
          unit_nproc=$(yq -r '.test_matrix.unit.nproc_per_node // ""' "$config_file")
          unit_groups=$(yq -o=json -I=0 '.test_matrix.unit.groups // []' "$config_file")
          unit_extra=$(yq -o=json -I=0 '.test_matrix.unit.pytest_extra_args // []' "$config_file")
          ignored=$(yq -o=json -I=0 '.test_matrix.unit.ignored_tests // []' "$config_file")
          train_matrix=$(yq -o=json -I=0 '.test_matrix.functional.train // []' "$config_file")
          runtime_environment=$(yq -o=json -I=0 '.te_fl.runtime.environment // {}' "$config_file")
          install_pip_args=$(yq -o=json -I=0 '.te_fl.runtime.install_pip_args // []' "$config_file")
          runtime_packages=$(yq -o=json -I=0 '.te_fl.runtime.pip_packages // []' "$config_file")

          if [ -z "$setup_script" ] || [ "$setup_script" = "null" ]; then
            echo "::error::setup_script is required" >&2
            exit 1
          fi
          if [ "$runs_on" = "[]" ] || [ "$devices" = "[]" ]; then
            echo "::error::runner_labels and device_types must not be empty" >&2
            exit 1
          fi
          if [ "$RUN_UNIT_TESTS" = true ]; then
            if [ "$unit_groups" = "[]" ]; then
              echo "::error::unit test groups are empty" >&2
              exit 1
            fi
            if ! [[ "$unit_nproc" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::unit nproc_per_node must be a positive integer" >&2
              exit 1
            fi
          fi
          if [ "$RUN_FUNCTIONAL_TESTS" = true ] && [ "$train_matrix" = "[]" ]; then
            echo "::error::functional test matrix is empty" >&2
            exit 1
          fi

          {
            echo "image=$image"
            echo "runs_on=$runs_on"
            echo "container_volumes=$volumes"
            echo "container_options=$options"
            echo "device_types=$devices"
            echo "setup_script=$setup_script"
            echo "unit_nproc_per_node=$unit_nproc"
            echo "train_test_matrix=$train_matrix"
            echo "unit_test_groups=$unit_groups"
            echo "unit_pytest_extra_args=$unit_extra"
            echo "ignored_tests=$ignored"
            echo "te_fl_runtime_environment=$runtime_environment"
            echo "te_fl_install_pip_args=$install_pip_args"
            echo "te_fl_runtime_pip_packages=$runtime_packages"
          } >> "$GITHUB_OUTPUT"

          echo "Platform: $PLATFORM"
          echo "Image: $image"

  lint:
    name: lint
    needs: checkout_and_config
    uses: ./.github/workflows/lint_common.yml

  unit_tests:
    name: unit_tests
    if: >-
      always() &&
      inputs.run_unit_tests &&
      needs.checkout_and_config.result == 'success' &&
      needs.lint.result == 'success'
    needs:
      - checkout_and_config
      - lint
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.checkout_and_config.outputs.device_types) }}
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      device: ${{ matrix.device }}
      image: ${{ needs.checkout_and_config.outputs.image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      setup_script: ${{ needs.checkout_and_config.outputs.setup_script }}
      test_groups: ${{ needs.checkout_and_config.outputs.unit_test_groups }}
      nproc_per_node: ${{ needs.checkout_and_config.outputs.unit_nproc_per_node }}
      pytest_extra_args: ${{ needs.checkout_and_config.outputs.unit_pytest_extra_args }}
      ignored_tests: ${{ needs.checkout_and_config.outputs.ignored_tests }}
      te_fl_prepare: ${{ inputs.te_fl_prepare }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  functional_tests:
    name: functional_tests
    if: >-
      always() &&
      inputs.run_functional_tests &&
      needs.checkout_and_config.result == 'success' &&
      needs.lint.result == 'success' &&
      (!inputs.run_unit_tests || needs.unit_tests.result == 'success')
    needs:
      - checkout_and_config
      - lint
      - unit_tests
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.checkout_and_config.outputs.device_types) }}
    uses: ./.github/workflows/functional_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      device: ${{ matrix.device }}
      image: ${{ needs.checkout_and_config.outputs.image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      setup_script: ${{ needs.checkout_and_config.outputs.setup_script }}
      test_matrix: ${{ needs.checkout_and_config.outputs.train_test_matrix }}
      te_fl_prepare: ${{ inputs.te_fl_prepare }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  all_tests_complete:
    name: all_tests_complete
    if: always()
    needs:
      - checkout_and_config
      - lint
      - unit_tests
      - functional_tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow status
        env:
          CHECKOUT_RESULT: ${{ needs.checkout_and_config.result }}
          TE_FL_PREPARE: ${{ inputs.te_fl_prepare }}
          TE_FL_CACHE_KEY: ${{ inputs.te_fl_cache_key }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUN_UNIT_TESTS: ${{ inputs.run_unit_tests }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          RUN_FUNCTIONAL_TESTS: ${{ inputs.run_functional_tests }}
          FUNCTIONAL_RESULT: ${{ needs.functional_tests.result }}
        run: |
          set -euo pipefail
          failed=false

          if [ "$CHECKOUT_RESULT" != success ]; then
            echo "::error::Configuration failed: $CHECKOUT_RESULT" >&2
            failed=true
          fi

          if [ "$TE_FL_PREPARE" = true ] && [ -z "$TE_FL_CACHE_KEY" ]; then
            echo "::error::TE-FL preparation was requested but no cache key was provided" >&2
            failed=true
          fi

          if [ "$LINT_RESULT" != success ]; then
            echo "::error::Lint failed: $LINT_RESULT" >&2
            failed=true
          fi
          if [ "$RUN_UNIT_TESTS" = true ] && [ "$UNIT_RESULT" != success ]; then
            echo "::error::Unit test gate failed: $UNIT_RESULT" >&2
            failed=true
          fi
          if [ "$RUN_FUNCTIONAL_TESTS" = true ] && [ "$FUNCTIONAL_RESULT" != success ]; then
            echo "::error::Functional test gate failed: $FUNCTIONAL_RESULT" >&2
            failed=true
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All requested checks completed successfully"
