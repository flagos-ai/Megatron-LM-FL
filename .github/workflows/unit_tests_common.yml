name: Common Unit Tests

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
    inputs:
      te_fl_artifact: {required: true, type: string}
      test_retries:
        required: false
        type: number
        default: 0
      source_ref:
        required: false
        type: string
        default: ''
        description: Optional immutable Megatron source SHA for requested tests
      platform:
        required: true
        type: string
        description: Platform configuration name
      device:
        required: true
        type: string
        description: Device type
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      setup_script:
        required: true
        type: string
        description: Repository-relative platform environment setup script
      test_groups:
        required: true
        type: string
        description: JSON array of unit test groups
      nproc_per_node:
        required: true
        type: string
        description: Number of distributed test processes
      pytest_extra_args:
        required: false
        type: string
        default: '[]'
        description: JSON array of additional pytest arguments
      experimental_pytest_extra_args:
        required: false
        type: string
        default: '[]'
        description: JSON array of arguments for an optional experimental pytest pass
      ignored_tests:
        required: false
        type: string
        default: '[]'
        description: JSON array of test files or node IDs to ignore
      te_fl_runtime_environment:
        required: true
        type: string
      te_fl_install_pip_args:
        required: true
        type: string
      te_fl_runtime_pip_packages:
        required: true
        type: string

jobs:
  unit_test:
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    name: unit-${{ inputs.device }}
    # Groups retain their individual 60-minute limits in the sequential runner.
    timeout-minutes: 720
    container:
      image: ${{ inputs.image }}
      ports:
        - 80
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    steps:
      - name: Checkout Source Code (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: true

      - name: Checkout Source Code (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: true

      - name: Checkout Source Code (attempt 3)
        id: checkout3
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: true

      - name: Setup platform environment
        working-directory: ${{ github.workspace }}
        env:
          CI_TEST_SUITE: unit
          CI_TEST_GROUP: __all__
          CI_NPROC_PER_NODE: ${{ inputs.nproc_per_node }}
          MEGATRON_CI_IMAGE: ${{ inputs.image }}
          TE_FL_RUNTIME_ENV_JSON: ${{ inputs.te_fl_runtime_environment }}
        run: |
          set -euo pipefail

          SETUP_SCRIPT='${{ inputs.setup_script }}'
          if [[ "$SETUP_SCRIPT" = /* || "$SETUP_SCRIPT" == *".."* ]]; then
            echo "::error::setup_script must be a repository-relative path"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$SETUP_SCRIPT" ]; then
            echo "::error::Platform setup script not found: $SETUP_SCRIPT"
            exit 1
          fi

          source "$GITHUB_WORKSPACE/.github/scripts/set_env_common.sh"
          if [ "$TE_FL_RUNTIME_ENV_JSON" != "{}" ]; then
            ci_apply_env_json "$TE_FL_RUNTIME_ENV_JSON"
          fi
          bash "$GITHUB_WORKSPACE/$SETUP_SCRIPT"
        timeout-minutes: 30

      - name: Install configured runtime packages
        env:
          CI_PLATFORM: ${{ inputs.platform }}
          CI_RUNTIME_PIP_PACKAGES_JSON: ${{ inputs.te_fl_runtime_pip_packages }}
          CI_RUNTIME_PIP_INSTALL_ARGS_JSON: ${{ inputs.te_fl_install_pip_args }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/set_env_common.sh"
          ci_install_runtime_packages

      - name: Download prepared TE-FL wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.te_fl_artifact }}
          path: te-fl-wheel

      - name: Install TE-FL wheel
        env:
          TE_FL_WHEEL_DIR: ${{ github.workspace }}/te-fl-wheel
          TE_FL_INSTALL_PIP_ARGS_JSON: ${{ inputs.te_fl_install_pip_args }}
        run: .github/scripts/install_te_fl_runtime.sh

      - name: Restore previous unit results
        id: unit_results_cache
        if: github.run_attempt > 1
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          path: .unit-checkpoint
          key: unit-results-v1-${{ github.run_id }}-${{ github.sha }}-${{ inputs.platform }}-${{ inputs.device }}-${{ github.run_attempt }}
          restore-keys: |
            unit-results-v1-${{ github.run_id }}-${{ github.sha }}-${{ inputs.platform }}-${{ inputs.device }}-

      - name: Run unit test groups sequentially
        id: unit_test
        working-directory: ${{ github.workspace }}
        env:
          CI_TEST_RETRIES: ${{ inputs.test_retries }}
          CI_UNIT_RESUME: ${{ steps.unit_results_cache.outcome == 'success' && steps.unit_results_cache.outputs.cache-matched-key != '' }}
          CI_PLATFORM: ${{ inputs.platform }}
          CI_DEVICE: ${{ inputs.device }}
          CI_TEST_GROUPS: ${{ inputs.test_groups }}
          CI_SETUP_SCRIPT: ${{ inputs.setup_script }}
          CI_NPROC_PER_NODE: ${{ inputs.nproc_per_node }}
          CI_IGNORED_TESTS: ${{ inputs.ignored_tests }}
          CI_PYTEST_EXTRA_ARGS: ${{ inputs.pytest_extra_args }}
          CI_EXPERIMENTAL_PYTEST_EXTRA_ARGS: ${{ inputs.experimental_pytest_extra_args }}
        run: python3 .github/scripts/run_unit_groups.py

      - name: Save unit results for reruns
        if: ${{ always() && steps.unit_test.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          path: .unit-checkpoint
          key: unit-results-v1-${{ github.run_id }}-${{ github.sha }}-${{ inputs.platform }}-${{ inputs.device }}-${{ github.run_attempt }}

      - name: Upload Coverage Report
        if: ${{ !cancelled() && steps.unit_test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}-${{ inputs.device }}
          overwrite: true
          path: coverage-report/**/*.json

      - name: Check FlagCICD upload prerequisites
        id: flagcicd
        if: ${{ !cancelled() && steps.unit_test.outcome != 'skipped' }}
        env:
          FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
          COVERAGE_REPORT_PATH: coverage-report/coverage-${{ inputs.platform }}-${{ inputs.device }}-all.json
        run: |
          if [ ! -f "$COVERAGE_REPORT_PATH" ]; then
            echo "::notice::Skipping FlagCICD upload: coverage report was not generated."
            echo "upload_ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$FLAGCICD_API_TOKEN" ]; then
            echo "::notice::Skipping FlagCICD upload: FLAGCICD_API_TOKEN is unavailable."
            echo "upload_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Coverage Report to FlagCICD
        if: ${{ !cancelled() && steps.flagcicd.outputs.upload_ready == 'true' }}
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        timeout-minutes: 2
        with:
          backend_url: 'https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/'
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          report_path: 'coverage-report/coverage-${{ inputs.platform }}-${{ inputs.device }}-all.json'
          job_name: coverage-${{ inputs.platform }}-${{ inputs.device }}-all
          fail_on_error: 'false'

      - name: Upload unit retry attempts
        if: always() && steps.unit_test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: unit-retry-${{ inputs.platform }}-${{ inputs.device }}
          path: .retry-logs/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: ignore
