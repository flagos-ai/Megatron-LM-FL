name: Common Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform configuration name
      device:
        required: true
        type: string
        description: Device type
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      setup_script:
        required: true
        type: string
        description: Repository-relative platform environment setup script
      test_groups:
        required: true
        type: string
        description: JSON array of unit test groups
      nproc_per_node:
        required: true
        type: string
        description: Number of distributed test processes
      pytest_extra_args:
        required: false
        type: string
        default: '[]'
        description: JSON array of additional pytest arguments
      ignored_tests:
        required: false
        type: string
        default: '[]'
        description: JSON array of test files or node IDs to ignore
      te_fl_prepare:
        required: true
        type: boolean
      te_fl_cache_key:
        required: false
        type: string
        default: ''
      te_fl_runtime_environment:
        required: true
        type: string
      te_fl_install_pip_args:
        required: true
        type: string
      te_fl_runtime_pip_packages:
        required: true
        type: string

jobs:
  unit_test:
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_group: ${{ fromJson(inputs.test_groups) }}
    name: unit-${{ inputs.device }}-${{ matrix.test_group.name }}
    container:
      image: ${{ inputs.image }}
      ports:
        - 80
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    steps:
      - name: Checkout Source Code (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          set-safe-directory: true

      - name: Checkout Source Code (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          set-safe-directory: true

      - name: Checkout Source Code (attempt 3)
        id: checkout3
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: true

      - name: Setup platform environment
        working-directory: ${{ github.workspace }}
        env:
          CI_TEST_SUITE: unit
          CI_TEST_GROUP: ${{ matrix.test_group.name }}
          CI_NPROC_PER_NODE: ${{ inputs.nproc_per_node }}
          MEGATRON_CI_IMAGE: ${{ inputs.image }}
          TE_FL_RUNTIME_ENV_JSON: ${{ inputs.te_fl_runtime_environment }}
        run: |
          set -euo pipefail

          SETUP_SCRIPT='${{ inputs.setup_script }}'
          if [[ "$SETUP_SCRIPT" = /* || "$SETUP_SCRIPT" == *".."* ]]; then
            echo "::error::setup_script must be a repository-relative path"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$SETUP_SCRIPT" ]; then
            echo "::error::Platform setup script not found: $SETUP_SCRIPT"
            exit 1
          fi

          source "$GITHUB_WORKSPACE/.github/scripts/set_env_common.sh"
          if [ "$TE_FL_RUNTIME_ENV_JSON" != "{}" ]; then
            ci_apply_env_json "$TE_FL_RUNTIME_ENV_JSON"
          fi
          bash "$GITHUB_WORKSPACE/$SETUP_SCRIPT"
        timeout-minutes: 30

      - name: Install configured runtime packages
        env:
          CI_RUNTIME_PIP_PACKAGES_JSON: ${{ inputs.te_fl_runtime_pip_packages }}
          CI_RUNTIME_PIP_INSTALL_ARGS_JSON: ${{ inputs.te_fl_install_pip_args }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/set_env_common.sh"
          ci_install_runtime_packages

      - name: Restore TE-FL wheel
        if: inputs.te_fl_prepare
        id: te_fl_cache
        uses: actions/cache/restore@v4
        with:
          path: te-fl-wheel
          key: ${{ inputs.te_fl_cache_key }}

      - name: Check TE-FL wheel cache
        if: inputs.te_fl_prepare
        env:
          CACHE_HIT: ${{ steps.te_fl_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != true ]; then
            echo "::error::TE-FL wheel cache was not restored" >&2
            exit 1
          fi

      - name: Install TE-FL wheel
        if: inputs.te_fl_prepare
        env:
          TE_FL_WHEEL_DIR: ${{ github.workspace }}/te-fl-wheel
          TE_FL_INSTALL_PIP_ARGS_JSON: ${{ inputs.te_fl_install_pip_args }}
        run: .github/scripts/install_te_fl_runtime.sh

      - name: Run unit tests - ${{ matrix.test_group.name }}
        id: unit_test
        working-directory: ${{ github.workspace }}
        env:
          CI_PLATFORM: ${{ inputs.platform }}
          CI_DEVICE: ${{ inputs.device }}
          CI_TEST_GROUP: ${{ matrix.test_group.name }}
          CI_TEST_PATH: ${{ matrix.test_group.path }}
          CI_NPROC_PER_NODE: ${{ inputs.nproc_per_node }}
          CI_IGNORED_TESTS: ${{ inputs.ignored_tests }}
          CI_PYTEST_EXTRA_ARGS: ${{ inputs.pytest_extra_args }}
        run: tests/test_utils/runners/run_ci_unit_tests.sh
        timeout-minutes: 60

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}
          path: coverage-report/coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}.json

      - name: Upload Coverage Report to FlagCICD
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        env:
          NO_PROXY: "flagcicd-inner.flagos.net"
        with:
          backend_url: 'http://flagcicd-inner.flagos.net:8000/metrics/'
          user_id: '000000000000000000'
          report_path: 'coverage-report/coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}.json'
          fail_on_error: 'false'
