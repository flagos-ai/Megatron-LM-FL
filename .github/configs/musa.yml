# MUSA Hardware Configuration for Megatron-LM-FL
# This file defines CI/CD settings for Moore Threads MUSA-based unit testing.

hardware_name: musa
display_name: 'S5000 Tests'
setup_script: .github/scripts/set_env_musa.sh

# Runner labels for Moore Threads node
runner_labels:
  - mt-8g-cicd-megatron
# CI image for online env
ci_image: harbor.baai.ac.cn/flagos-dev/flagscale-train:f147682-musa-dev

# Dataset/tokenizer volumes for local runner assets under /data
container_volumes:
  - /home/flagscale_cicd/flask/static:/workspace/report
  - /home/flagscale_cicd/flask/config:/workspace/config
  - /data/megatron-ci-assets-20260726/baai_datasets:/home/gitlab-runner/data
  - /data/megatron-ci-assets-20260726/baai_tokenizers:/home/gitlab-runner/tokenizers
  - /data/megatron-ci-assets-20260726/baai_datasets:/opt/data/datasets
  - /data/megatron-ci-assets-20260726/baai_tokenizers:/opt/data/tokenizers
  # Override broken libmusa.so stub inside the image.
  - /usr/lib/x86_64-linux-gnu/libmusa.so:/usr/lib/x86_64-linux-gnu/libmusa.so
  - /usr/lib/x86_64-linux-gnu/libmusa.so.1:/usr/lib/x86_64-linux-gnu/libmusa.so.1
  - /usr/lib/x86_64-linux-gnu/libmusa.so.4.3.5:/usr/lib/x86_64-linux-gnu/libmusa.so.4.3.5
  # Mount MUSA driver runtime libraries.
  - /usr/local/musa-4.3.4:/usr/local/musa-4.3.4

# Container options (hardware-specific settings)
container_options: >-
  --privileged
  --shm-size=500g
  --hostname megatron_cicd
  --user root
  --ulimit nofile=65535:65535

# Device types to run tests on
device_types:
  - s5000

# Test matrix configuration
test_matrix:
  unit:
    nproc_per_node: 8
    pytest_extra_args: []
    groups:
      - name: core
        path: tests/unit_tests/test_*.py
        description: Core unit tests
      - name: models
        path: tests/unit_tests/models/
        description: Model tests
      - name: distributed
        path: tests/unit_tests/distributed/
        description: Distributed tests
      - name: dist_checkpointing
        path: tests/unit_tests/dist_checkpointing/
        description: Distributed checkpointing tests
      - name: tensor_parallel
        path: tests/unit_tests/tensor_parallel/
        description: Tensor parallel tests
      - name: pipeline_parallel
        path: tests/unit_tests/pipeline_parallel/
        description: Pipeline parallel tests
      - name: data
        path: tests/unit_tests/data/
        description: Data tests
      - name: fusions
        path: tests/unit_tests/fusions/
        description: Fusion tests
      - name: others
        path: tests/unit_tests/export/ tests/unit_tests/post_training/ tests/unit_tests/tokenizers/ tests/unit_tests/utils/
        description: Export, post-training, tokenizer, and utility tests
    # Start with a conservative MUSA smoke set while validating runtime and TE plugin coverage.
    ignored_tests:
      # ── Core tests that genuinely require CUDA/NCCL/Apex/TE GPU paths ──────────
      - tests/unit_tests/test_fp8_param.py          # FP8 training with TE + CUDA graphs
      - tests/unit_tests/test_fp8_utils.py           # TestFP8Padding needs CUDA/TE
      - tests/unit_tests/test_fp4_param.py           # NVFP4 requires Blackwell+ TE
      - tests/unit_tests/test_imports.py             # Import chains hit TE/CUDA modules
      - tests/unit_tests/test_nccl_allocator.py      # NCCL-specific memory allocator
      - tests/unit_tests/test_local_multi_tensor_fns.py  # Apex amp_C CUDA kernels
      - tests/unit_tests/test_muon_optimizer.py      # Hardcoded device='cuda', Newton-Schulz
      - tests/unit_tests/test_optimizer.py           # FusedAdam + fp8_autocast + DDP
      - tests/unit_tests/test_optimizer_cpu_offloading.py  # CPU-GPU offloading, .cuda()
      - tests/unit_tests/test_layer_wise_optimizer.py      # .cuda() + multi-rank
      - tests/unit_tests/test_inference.py           # InferenceEngineHarness + Flask
      # ── Import chain risk: megatron.training.arguments → TE/CUDA modules ───────
      - tests/unit_tests/test_api_backwards_compat_setup.py::test_decorator_module
      - tests/unit_tests/test_api_backwards_compat_setup.py::test_decorators_work
      # core-TCP store teardown leaves residual sockets that cause
      # 60s timeouts between destroy/init cycles.  Skip the whole file
      # (same approach as Metax).
      - tests/unit_tests/test_parallel_state.py
      # These core tests enter MCCL default-process-group collectives that
      # currently time out while exchanging McclUniqueId on the MUSA image.
      - tests/unit_tests/test_process_groups_config.py::TestPGConfigDefaultInitialization::test_default_initialization
      - tests/unit_tests/test_training.py::TestTraining::test_build_train_valid_test_data_iterators
      - tests/unit_tests/test_training.py::TestTraining::test_closed_formula_vocab_size_with_padding
      - tests/unit_tests/test_training.py::TestSaveGrads::test_save_grads
      # These mocked HyperCommGrid tests still call dist.get_rank() without a
      # default process group. The real NCCL integration class skips on MUSA.
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_create_pg_single_dim
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_create_pg_multiple_dims
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_create_pg_with_options
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_create_pg_duplicate_error
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_get_pg_success
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_get_pg_multiple_dims
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGrid::test_end_to_end_workflow
      # TestHyperCommGridIntegration requires torch.distributed.ProcessGroupNCCL which
      # does not exist in MUSA PyTorch (uses MCCL backend without ProcessGroupNCCL class).
      # Metax/Ascend torch builds expose ProcessGroupNCCL compatibility class; MUSA does not.
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGridIntegration
      # torch.cuda.nvtx is not provided by the MUSA PyTorch build.
      - tests/unit_tests/test_utils.py::test_nvtx_range
      # core-test_utils.py flaky tests that hang on MUSA MCCL collective communication.
      # test_check/cross_check_param_hashes call torch.distributed.all_gather() which deadlocks
      # with partial ranks stalling while others complete. test_param_norm_* use DistributedDataParallel
      # and may trigger similar MCCL synchronization issues. test_straggler_detector is inherently flaky.
      # Align with Ascend's conservative approach: skip all @pytest.mark.flaky tests in test_utils.py.
      - tests/unit_tests/test_utils.py::test_check_param_hashes_across_dp_replicas
      - tests/unit_tests/test_utils.py::test_cross_check_param_hashes_across_dp_replicas
      - tests/unit_tests/test_utils.py::test_param_norm_linear[False]
      - tests/unit_tests/test_utils.py::test_param_norm_linear[True]
      - tests/unit_tests/test_utils.py::test_param_norm_moe[False]
      - tests/unit_tests/test_utils.py::test_param_norm_moe[True]
      - tests/unit_tests/test_utils.py::test_straggler_detector
      # PyTorch 2.5 _coalescing_manager compatibility issue with MUSA torch_musa
      # Mocked all_reduce returns None → op_list empty → work never assigned → UnboundLocalError
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_force_all_reduce_uses_correct_collective[False]
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_force_all_reduce_uses_correct_collective[True]
      # distributed-bucket_group_cpu_sync produces different numerical results on MUSA.
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_manual_bucket_group_cpu_sync_partition_and_buffer_helpers
      # The eight-rank DDP process-group case times out during MCCL initialization;
      # later distributed failures are cascading rank desynchronization.
      - tests/unit_tests/distributed/test_distributed_data_parallel.py::TestDistributedDataParallel::test_ddp_with_dp_process_groups[8]
      # reduce_scatter with fp32 accumulation can SIGSEGV on rank 5 in the MUSA
      # runtime for this parameter combination; other combinations remain enabled.
      - tests/unit_tests/distributed/test_reduce_scatter_with_fp32_accumulation.py::TestReduceScatterWithFP32Accumulation::test_reduce_scatter_with_fp32_accumulation[False-True]
      # MoE expert reconfiguration repeatedly creates/destroys MCCL process
      # groups.  After several teardown/reinit cycles the TCP store state
      # becomes non-deterministic (port TIME_WAIT, McclUniqueId desync) and
      # a later parametrized variant hangs — which variant fails changes
      # between runs (observed: etp2, etp3, etp14).  Whole-function skip
      # matches Ascend's approach for the same underlying MCCL stream-ceiling.
      - tests/unit_tests/dist_checkpointing/models/test_moe_experts.py::TestExpertLayerReconfiguration::test_parallel_reconfiguration_e2e
      # FSDP tests enter CUDA-specific runtime paths in the current MUSA image.
      - tests/unit_tests/distributed/megatron_fsdp/test_mcore_fully_sharded_data_parallel.py
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py
      # test_torch_fully_sharded_parallel: HAVE_FSDP=False (torch.distributed.fsdp.fully_shard unavailable in torch_musa 2.1)
      - tests/unit_tests/distributed/test_torch_fully_sharded_parallel.py
      # These checkpointing paths require CUDA-backed TE or optimizer APIs.
      - tests/unit_tests/dist_checkpointing/models/test_mamba.py
      - tests/unit_tests/dist_checkpointing/models/test_mlp_glu.py::TestParallelMLPWithGLU::test_oom_is_handled
      - tests/unit_tests/dist_checkpointing/models/test_moe_experts.py::TestExpertLayerReconfiguration::test_sequential_grouped_mlp_extra_state
      - tests/unit_tests/dist_checkpointing/models/test_moe_experts.py::TestExpertLayerReconfiguration::test_te_grouped_linear_torch_native
      - tests/unit_tests/dist_checkpointing/test_fp8.py
