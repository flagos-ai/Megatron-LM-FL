# CUDA Hardware Configuration for Megatron-LM-FL
# This file defines CI/CD settings for CUDA-based testing
# Test configurations are defined in tests/test_utils/config/platforms/cuda.yaml

hardware_name: cuda
display_name: 'CUDA Tests'
setup_script: .github/scripts/set_env_cuda.sh

# CI image for online env
ci_image: harbor.baai.ac.cn/flagscale/megatron-lm-fl:manual-20260828-cuda-dev

# Runner labels for A100 node
runner_labels:
  - flagcicd-a100

# Container volumes (hardware-specific paths)
# container_volumes:
#   - /home/flagscale_cicd/flask/static:/workspace/report
#   - /home/flagscale_cicd/flask/config:/workspace/config
#   - /home/flagscale_cicd/docker/docker_build/docker_data:/home/gitlab-runner/data
#   # Official functional recipes expect frozen checkpoints and artifacts here.
#   - /home/flagscale_cicd/docker/docker_build/docker_data:/mnt/artifacts
#   - /home/flagscale_cicd/docker/docker_build/docker_tokenizers:/home/gitlab-runner/tokenizers
#   - /home/flagscale_cicd/docker/docker_build/docker_data/Megatron-LM/datasets:/opt/data/datasets
#   - /home/flagscale_cicd/docker/docker_build/docker_tokenizers/Megatron-LM/tokenizers:/opt/data/tokenizers

# Container volumes for online env
container_volumes:
  - /mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data
  - /mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers
  - /mnt/airs-business/cicd/baai_datasets:/opt/data/datasets
  - /mnt/airs-business/cicd/baai_tokenizers:/opt/data/tokenizers

# Container options (hardware-specific settings)
container_options: '--privileged --gpus all --shm-size=500g --hostname megatron_cicd --user root --ulimit nofile=65535:65535'

# Device types to run tests on
device_types:
  - a100

# Test matrix configuration
test_matrix:
  unit:
    nproc_per_node: 8
    devices:
      - a100
    pytest_extra_args:
      - -m
      - not experimental and not flaky_in_dev
    experimental_pytest_extra_args:
      - --experimental
      - -m
      - experimental and not flaky_in_dev
    groups:
      - name: core
        path: tests/unit_tests/test_*.py megatron/plugin/tests/
        description: Core unit tests
      - name: models
        path: tests/unit_tests/models/
        description: Model tests
      - name: distributed
        path: tests/unit_tests/distributed/
        description: Distributed tests
      - name: dist_checkpointing
        path: tests/unit_tests/dist_checkpointing/
        description: Distributed checkpointing tests
      - name: tensor_parallel
        path: tests/unit_tests/tensor_parallel/
        description: Tensor parallel tests
      - name: pipeline_parallel
        path: tests/unit_tests/pipeline_parallel/
        description: Pipeline parallel tests
      - name: data
        path: tests/unit_tests/data/
        description: Data tests
      - name: fusions
        path: tests/unit_tests/fusions/
        description: Fusion tests
      - name: transformer
        path: tests/unit_tests/transformer/
        description: Transformer tests
      - name: others
        path: tests/unit_tests/post_training/ tests/unit_tests/tokenizers/ tests/unit_tests/utils/
        description: post-training, tokenizer, and utility tests
    # Ignored test files for unit tests
    # These files will be skipped when running pytest
    ignored_tests:
      # Data
      # Requires the upstream HuggingFace tokenizer fixture, which is not present in FL CI assets.
      - tests/unit_tests/data/test_fim_dataset.py

      # Distributed checkpointing
      - tests/unit_tests/dist_checkpointing/models/test_bert_model.py::TestBertModel::test_sharded_state_dict_save_load
      - tests/unit_tests/dist_checkpointing/models/test_gpt_model.py::TestGPTModel::test_sharded_state_dict_save_load
      - tests/unit_tests/dist_checkpointing/models/test_mamba.py
      - tests/unit_tests/dist_checkpointing/models/test_moe_experts.py
      - tests/unit_tests/dist_checkpointing/models/test_t5_model.py::TestT5Model::test_sharded_state_dict_save_load
      - tests/unit_tests/data/test_preprocess_data.py
      # Downloads GPT-2 tokenizer files when the mounted offline fixture is absent.
      # CI runners cannot rely on external Hugging Face/S3 access.
      - tests/unit_tests/data/test_preprocess_mmdata.py
      - tests/unit_tests/dist_checkpointing/test_global_metadata_reuse.py
      - tests/unit_tests/dist_checkpointing/test_nonpersistent.py
      - tests/unit_tests/dist_checkpointing/test_optimizer.py
      - tests/unit_tests/dist_checkpointing/test_safe_globals.py
      - tests/unit_tests/dist_checkpointing/test_serialization.py::TestSerialization::test_remove_sharded_tensors ## NCCL hangs inexplicably during distributed barrier with TP=2 PP=4 on 8 GPUs

      # Distributed
      # Sporadic CUDA async allocation failure leaves NCCL ranks on different collective sequences.
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py::TestMegatronFsdpFullyShard::test_fully_shard_custom_dtype
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py::TestMegatronFsdpFullyShard::test_fully_shard_te_quantized
      # The A100 CI image (PyTorch 2.7.0a0 nv25.3) repeatedly leaves ranks on
      # different NCCL collective sequences; the same case passes on 8xH100
      # with PyTorch 2.7.1. Re-enable after upgrading the CUDA CI image.
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py::TestMegatronFsdpFullyShard::test_fully_shard
      - tests/unit_tests/distributed/megatron_fsdp/test_mcore_fully_sharded_data_parallel.py
      - tests/unit_tests/distributed/test_grad_sync_with_expert_parallel.py
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py ## test_bucket_sizes[True-True-False-18050] FAILED NCCL SIGABRT

      # Fusions
      # CUDA CI sees sporadic backward gradient mismatches from the fused kernel;
      # the numeric error is within 1 ULP but outside allclose.
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py::TestFusedMLARope::test_inplace_forward_backward
      # KV-split MLA RoPE fusion hits sporadic Triton autotune/compile failures on shared A100 CI.
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py::TestFusedMLARope::test_kv_split_forward_backward[False-sbhd]
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py::TestFusedMLARope::test_kv_split_forward_backward[False-thd]
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py::TestFusedMLARope::test_kv_split_forward_backward[True-sbhd]
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py::TestFusedMLARope::test_kv_split_forward_backward[True-thd]

      # Models
      # Dynamic inference FP8 selects Flash Attention with an unsupported test head size.
      - tests/unit_tests/models/test_gpt_model.py::TestGPTWithDynamicInference::test_dynamic_inference_padding_with_fp8
      # FL does not modify upstream Mamba logic, and mamba-ssm is not installed in the CUDA CI image.
      - tests/unit_tests/models/test_hybrid_model.py
      - tests/unit_tests/models/test_hybrid_moe_model.py
      - tests/unit_tests/models/test_mamba_moe_model.py ## sporadic cuda malloc error on CI machines, tests passed locally
      - tests/unit_tests/models/test_mimo_1f1b_schedule.py ## HyperCommGrid + TE attention: TE requires global _TENSOR_MODEL_PARALLEL_GROUP but HyperCommGrid only sets per-grid process groups
      - tests/unit_tests/models/test_mimo_checkpoint.py ## same HyperCommGrid + TE attention issue as test_mimo_1f1b_schedule

      # Post-training
      - tests/unit_tests/post_training/test_modelopt_model_builder.py::test_model_provider_switches_to_modelopt_builder ## ModelOpt is excluded from the FL CUDA CI image
      - tests/unit_tests/post_training/test_modelopt_module_spec.py

      # Tensor parallel
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_GatherFromSequenceParallelRegion ## sporadic NCCL all-gather OOM on shared A100 CI runner

      # Tokenizers
      - tests/unit_tests/tokenizers/test_tokenizer.py

      # Transformer
      # A100 (SM80) cannot execute Transformer Engine FP8, which requires SM89+.
      - tests/unit_tests/transformer/test_transformer_block.py::TestParallelTransformerBlock::test_gpu_forward_full_checkpoint_fp8
      - tests/unit_tests/transformer/test_transformer_block.py::TestParallelTransformerBlock::test_gpu_forward_selective_checkpoint_fp8
      # The current A100 TE/cuDNN stack has no backend for padded THD attention.
      - tests/unit_tests/transformer/test_attention_packed_seq.py::TestParallelAttentionWithPackedPaddedSequence::test_gpu_forward
      - tests/unit_tests/transformer/test_multi_latent_attention.py::TestParallelMLAAttention::test_gpu_forward_thd_padded[yarn]
      - tests/unit_tests/transformer/test_multi_latent_attention.py::TestParallelMLAAttention::test_gpu_forward_thd_padded[rope]
      - tests/unit_tests/transformer/test_thd_correctness.py::test_thd_format[tp2_cp4_sp]
      - tests/unit_tests/transformer/test_thd_correctness.py::test_thd_format[tp2_cp2_sp_longseq]
      - tests/unit_tests/transformer/test_thd_correctness.py::test_thd_format[short_seqs_parallel]
      - tests/unit_tests/transformer/test_thd_correctness.py::test_thd_format[extreme_mixed]
      - tests/unit_tests/transformer/test_thd_correctness.py::test_thd_format[long_short_mix]
      - tests/unit_tests/transformer/test_multi_latent_attention.py::TestContextParallelMLAAttentionPrecision::test_gpu_forward_thd_precision[rope-False]
      - tests/unit_tests/transformer/test_multi_latent_attention.py::TestContextParallelMLAAttentionPrecision::test_gpu_forward_thd_precision[yarn-False]
      - tests/unit_tests/transformer/test_multi_latent_attention.py::TestContextParallelMLAAttentionPrecision::test_gpu_forward_thd_precision[yarn-True]
      # DSv4 native parity with compress_ratio=4 requires the optional
      # fast_hadamard_transform package, which is not installed in the CUDA CI image.
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-False-False-4-flash-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-False-False-4-pro-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-False-True-4-flash-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-False-True-4-pro-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-True-False-4-flash-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-True-False-4-pro-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-True-True-4-flash-unfused]
      - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_native_parity.py::TestDSv4HybridNativeParity::test_attention_matches_native_reference[4096-True-True-4-pro-unfused]
      # These strict numerical checks pass on H100 but exceed tolerance on the A100 CI stack.
      - tests/unit_tests/transformer/experimental_attention_variant/test_attention_variant_dsa.py::TestFusedDSAIndexerLossGradient::test_fused_indexer_loss_gradient_matches_autograd[False]
      - tests/unit_tests/transformer/experimental_attention_variant/test_attention_variant_dsa.py::TestFusedDSAIndexerLossGradient::test_fused_indexer_loss_gradient_matches_autograd[True]
      - tests/unit_tests/transformer/test_transformer_block_custom_pgs.py::TestTransformerBlockWithProcessGroups::test_mlp_with_custom_pgs[8-4-2-True]
      - tests/unit_tests/transformer/test_transformer_layer.py::TestParallelTransformerLayer::test_chunked_mlp
      # On the A100 CI stack, shared-expert all-to-all backward can leave ranks on
      # different default-PG collective sequences and hit the NCCL watchdog timeout.
      - tests/unit_tests/transformer/moe/test_shared_experts.py

      # Top-level unit tests
      # FL does not modify upstream FP8 block-scaling logic; the CUDA CI image is below CUDA 12.9.
      - tests/unit_tests/test_fp8_param.py
      - tests/unit_tests/test_inference.py
      # PyTorch 2.7/NCCL allocator teardown leaves the CUDA context invalid on the local CI stack.
      - tests/unit_tests/test_nccl_allocator.py
      # test_straggler_detector causes a SIGSEGV (Signal 11) crash during pytest session teardown on A100.
      # Root cause: UCX (HPC-X libucs.so) crashes in torch.distributed.barrier() called from the
      # session-scoped cleanup fixture in conftest.py, likely because the distributed process group
      # is in an inconsistent state after the test completes. This is a UCX/NCCL environment issue,
      # not a logic bug. Skipped until the teardown issue is resolved.
      - tests/unit_tests/test_utils.py::test_straggler_detector

  functional:
    train:
      - model: gpt
        test_case: qwen3_0p6b_mcore_te_tp1_pp1_no_mmap_bin_files
        training_script: pretrain_gpt.py
        n_repeat: 1
        golden_environment: dev
        golden_platform: dgx_a100
        enable_lightweight_mode: false
        gpus_per_node: 1
      - model: gpt
        test_case: qwen3_0p6b_mcore_te_tp2_pp2_benchmark
        training_script: pretrain_gpt.py
        n_repeat: 1
        golden_environment: dev
        golden_platform: dgx_a100
        enable_lightweight_mode: false
        gpus_per_node: 4

# TE-FL runtime configuration
te_fl:
  prepare: true
  build_mode: cuda
  build_environment:
    NVTE_FRAMEWORK: pytorch
    NVTE_WITH_USERBUFFERS: "0"
    NVTE_WITH_CUDA: "1"
    NVTE_WITH_NCCL_EP: "0"
    NVTE_CUDA_ARCHS: "80"
    CMAKE_CUDA_ARCHITECTURES: "80"
    TORCH_CUDA_ARCH_LIST: "8.0"
  runtime:
    environment:
      TE_FL_PREFER: flagos
    install_pip_args: []
    pip_packages: [flag-gems, sqlalchemy]
