      - tests/unit_tests/tensor_parallel/test_random.py::test_checkpoint
      - tests/unit_tests/tensor_parallel/test_random.py::test_checkpoint_without_output
      - tests/unit_tests/tensor_parallel/test_random.py::test_checkpoint_without_output_view_sharing_regression

      # pipeline_parallel
      # TE-FL FlagGems te_general_grouped_gemm broadcast shape mismatch.
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_gpt_fine_grained_activation_offloading_correctness_and_memory
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_fine_grained_activation_offload_with_ep_a2a_overlap_compatibility

      # others
      # TE-FL missing fused_amax_and_scale_update_after_reduction.
      # These three tests are also ignored on metax.
      - tests/unit_tests/export/trtllm/test_distributed_fp8.py
      - tests/unit_tests/export/trtllm/test_single_device_fp8.py
      - tests/unit_tests/export/trtllm/test_trtllm_helper.py
      # The distributed TRT-LLM converter errors during setup on BW1000.
      - tests/unit_tests/export/trtllm/test_trtllm_distributed_gpu_converter.py
      # ModelOpt not available on BW1000.
      - tests/unit_tests/post_training/test_modelopt_model_builder.py::test_model_provider_switches_to_modelopt_builder
      # The GPT checkpoint restore blocks at rank-synchronized temporary
      # directory setup until the Hygon unit-test hard timeout terminates it.
      - tests/unit_tests/post_training/test_modelopt_module_spec.py
      # tokenizers.Encoding has no 'copy' attribute in this image.
      - tests/unit_tests/tokenizers/test_tokenizer.py
      # The test branches on torch.distributed.is_initialized() while
      # log_single_rank() falls back to the RANK env var, so under torchrun
      # with no initialized process group ranks 1-7 expect a record that
      # safe_get_rank() suppressed. Every other platform passes only because
      # an earlier file in this group leaves a process group initialized;
      # hygon ignores all four of those files, so utils/ runs first and the
      # guard mismatch surfaces.
      - tests/unit_tests/utils/test_experimental_log_once.py

