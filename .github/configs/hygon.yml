      - tests/unit_tests/tensor_parallel/test_random.py::test_model_parallel_cuda_manual_seed
      - tests/unit_tests/tensor_parallel/test_tensor_parallel_utils.py::test_split_tensor_into_1d_equal_chunks
      - tests/unit_tests/tensor_parallel/test_tensor_parallel_utils.py::test_gather_split_1d_tensor
      # These checkpoint helpers reinitialize model-parallel groups after the
      # RNG tests.  A later RCCL group bootstrap can hang on BW1000 even when
