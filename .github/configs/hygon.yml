      - tests/unit_tests/tensor_parallel/test_initialization.py
      # This file is the first remaining tensor-parallel test after the
      # exclusions above. Its TP=1 case stalls while creating model-parallel
      # groups on the 8-rank job; one rank exits and 175 partial groups abort.
      - tests/unit_tests/tensor_parallel/test_layers.py
      # All seven mapping tests repeatedly initialize TP=4/PP=2 groups. Ranks
      # diverge during RCCL unique-ID rendezvous (success on some ranks, 60s
