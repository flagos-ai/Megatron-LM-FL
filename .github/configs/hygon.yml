      # RCCL fails during that bootstrap on BW1000 and cascades to all ranks.
      - tests/unit_tests/tensor_parallel/test_data.py::test_broadcast_data
      # The initialization suite repeats the same 1-rank -> 4-rank group
      # teardown/rebuild sequence for regular and TE linear layers.  Once the
      # first case poisons RCCL state, later cases either fail or wait for the
