te_fl:
  prepare: true
  build_mode: python
  build_environment:
    TE_FL_SKIP_CUDA: '1'
  runtime:
    environment:
      TE_FL_SKIP_CUDA: '1'
      TE_FL_PREFER: flagos
      # IXTE-specific ops retain native routing. SGD uses the image's validated
      # PyTorch reference fix; routing does not supply missing native symbols.
      TE_FL_PER_OP: "rmsnorm_bwd_add=impl:vendor.iluvatar;te_general_grouped_gemm=impl:vendor.iluvatar;multi_tensor_sgd=impl:reference.torch"
    install_pip_args: []
    pip_packages:
      - flag-gems
      - sqlalchemy
