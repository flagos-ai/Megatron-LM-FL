experiment:
  exp_name: megalens-dual-node-flagcx-dp2-distopt
  seed: 42
  save_steps: 2
  load: null
  exp_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}
  ckpt_format: torch_dist
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    type: cloud
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    rdzv_endpoint: ${oc.env:MASTER_ADDR}:${oc.env:MASTER_PORT}
    hostfile: null
    nnodes: 2
    node_rank: ${oc.decode:${oc.env:NODE_RANK}}
    nproc_per_node: 1
    master_addr: ${oc.env:MASTER_ADDR}
    master_port: ${oc.decode:${oc.env:MASTER_PORT}}
    redirects: 0
    tee: 3
  cmds:
    before_start: source /root/miniconda3/bin/activate flagscale-train
  envs:
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    GLOO_SOCKET_IFNAME: bond0.2208
    FLAGCX_SOCKET_IFNAME: "=bond0.2208"
    FLAGCX_IB_DISABLE: 0
    FLAGCX_IB_HCA: mlx5_101,mlx5_102,mlx5_103,mlx5_104,mlx5_105,mlx5_106,mlx5_107,mlx5_108
    FLAGCX_TOPO_DETECTION_DISABLE: 0
    FLAGCX_DEBUG: INFO
    FLAGCX_DEBUG_SUBSYS: INIT,ENV,NET
    NCCL_NVLS_ENABLE: 0
action: test
train:
  system:
    no_shared_fs: false
    num_workers: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    distributed_backend: flagcx
    disable_bias_linear: true
    sequence_parallel: false
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    num_distributed_optimizer_instances: 1
    finetune: false
    trace: ${oc.decode:${oc.env:MEGALENS_GATE_TRACE,false}}
    trace_mode: 1
    trace_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/traces
    hardware_monitor: false
    trace_interval: 1
    continuous_trace_iterations: 1
    trace_granularity: base
    trace_cupti_kernels: "off"
    precision:
      bf16: true
      attention_softmax_in_fp32: true
    logging:
      log_interval: 1
      log_throughput: true
    checkpoint:
      save_interval: 100
      ckpt_format: torch_dist
  model:
    transformer_impl: transformer_engine
    num_layers: 2
    hidden_size: 128
    ffn_hidden_size: 256
    kv_channels: 32
    num_attention_heads: 4
    seq_length: 128
    max_position_embeddings: 128
    position_embedding_type: rope
    use_rotary_position_embeddings: true
    normalization: RMSNorm
    swiglu: true
    untie_embeddings_and_output_weights: true
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 2
    eval_iters: 0
    eval_interval: 100
    optimizer:
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 0.00015
        min_lr: 0.00001
        lr_decay_iters: 2
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine
  data:
    mock_data: true
    split: "99,1,0"
    data_cache_path: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/data-cache
    tokenizer:
      tokenizer_type: NullTokenizer
      vocab_size: 1024
hydra:
  run:
    dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/hydra/node_${oc.env:NODE_RANK}
