# G8.8 keeps the validated G8.3 Transformer Engine whole-layer Graph route
# and enables CUDA kernel capture for eager iteration 1 and replay iteration 2.
experiment:
  exp_name: megalens-g8-8-te-cuda-graph-full-cupti
  seed: 42
  save_steps: 2
  load: null
  exp_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}
  ckpt_format: torch_dist
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    rdzv_endpoint: ${oc.env:MEGALENS_GATE_RDZV_ENDPOINT}
    hostfile: null
    nproc_per_node: 1
    redirects: 0
    tee: 3
  cmds:
    before_start: source /root/miniconda3/bin/activate flagscale-train
  envs:
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
action: test
train:
  system:
    no_shared_fs: false
    num_workers: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_model_parallel_size: 1
    distributed_backend: nccl
    disable_bias_linear: true
    sequence_parallel: false
    use_distributed_optimizer: false
    finetune: false
    trace: ${oc.decode:${oc.env:MEGALENS_GATE_TRACE,false}}
    trace_mode: 1
    trace_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/traces
    hardware_monitor: false
    trace_interval: 1
    continuous_trace_iterations: 1
    trace_granularity: full
    trace_cupti_kernels: "on"
    precision:
      bf16: true
      attention_softmax_in_fp32: true
    logging:
      log_interval: 1
      log_throughput: true
    checkpoint:
      save_interval: 100
      ckpt_format: torch_dist
  model:
    transformer_impl: transformer_engine
    cuda_graph_impl: transformer_engine
    cuda_graph_warmup_steps: 1
    num_layers: 2
    hidden_size: 128
    ffn_hidden_size: 256
    kv_channels: 32
    num_attention_heads: 4
    seq_length: 128
    max_position_embeddings: 128
    position_embedding_type: rope
    use_rotary_position_embeddings: true
    normalization: RMSNorm
    swiglu: true
    untie_embeddings_and_output_weights: true
    micro_batch_size: 1
    global_batch_size: 1
    train_iters: 2
    eval_iters: 0
    eval_interval: 100
    optimizer:
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 0.00015
        min_lr: 0.00001
        lr_decay_iters: 2
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine
  data:
    mock_data: true
    split: "99,1,0"
    data_cache_path: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/data-cache
    tokenizer:
      tokenizer_type: NullTokenizer
      vocab_size: 1024
hydra:
  run:
    dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/hydra
