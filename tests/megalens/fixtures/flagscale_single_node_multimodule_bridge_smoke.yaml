experiment:
  exp_name: megalens-bridge-multimodule
  seed: 42
  save_steps: 1
  load: null
  exp_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}
  ckpt_format: torch
  task:
    type: train
    backend: native
    entrypoint: /workspace/Megatron-LM-FL/tests/test_utils/runners/run_multimodule_bridge.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    rdzv_endpoint: ${oc.env:MEGALENS_GATE_RDZV_ENDPOINT}
    hostfile: null
    nproc_per_node: 2
    redirects: 0
    tee: 3
  cmds:
    before_start: source /root/miniconda3/bin/activate flagscale-train
  envs:
    CUDA_VISIBLE_DEVICES: "0,1"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
action: test
train:
  system:
    no_shared_fs: false
    trace: ${oc.decode:${oc.env:MEGALENS_GATE_TRACE,false}}
    trace_mode: 1
    trace_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/traces
    hardware_monitor: false
    trace_interval: 1
    continuous_trace_iterations: 1
    trace_granularity: base
    trace_cupti_kernels: "off"
    checkpoint:
      save: null
      load: null
    logging: {}
  bridge:
    hidden_size: 512
    seq_length: 64
    micro_batch_size: 2
    num_microbatches: 4
hydra:
  run:
    dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/hydra
