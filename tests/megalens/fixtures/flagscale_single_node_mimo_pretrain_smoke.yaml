experiment:
  exp_name: megalens-mimo-production-pretrain
  seed: 42
  save_steps: 1
  load: null
  exp_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}
  ckpt_format: torch_dist
  task:
    type: train
    backend: megatron
    entrypoint: /workspace/Megatron-LM-FL/tests/test_utils/runners/run_flagscale_mimo_pretrain.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    rdzv_endpoint: ${oc.env:MEGALENS_GATE_RDZV_ENDPOINT}
    hostfile: null
    nproc_per_node: 2
    redirects: 0
    tee: 3
  cmds:
    before_start: source /root/miniconda3/bin/activate flagscale-train
  envs:
    CUDA_VISIBLE_DEVICES: "0,1"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
action: test
train:
  system:
    no_shared_fs: false
    num_workers: 0
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_model_parallel_size: 1
    distributed_backend: nccl
    sequence_parallel: false
    use_distributed_optimizer: false
    finetune: false
    trace: ${oc.decode:${oc.env:MEGALENS_GATE_TRACE,false}}
    trace_mode: 1
    trace_dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/traces
    hardware_monitor: false
    trace_interval: 1
    continuous_trace_iterations: 2
    trace_granularity: full
    trace_cupti_kernels: "off"
    logging:
      log_interval: 1
      log_throughput: true
    checkpoint:
      save_interval: 100
      ckpt_format: torch_dist
  model:
    transformer_impl: transformer_engine
    num_layers: 1
    hidden_size: 128
    ffn_hidden_size: 512
    num_attention_heads: 4
    seq_length: 256
    max_position_embeddings: 2048
    micro_batch_size: 1
    global_batch_size: 4
    train_iters: 2
    eval_iters: 0
    eval_interval: 100
    optimizer:
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 0.00015
        min_lr: 0.00001
        lr_decay_iters: 2
        lr_warmup_fraction: 0.01
        lr_decay_style: linear
  data:
    dataset_provider: mock
    model_provider: mock
    image_size: 224
    total_seq_length: 256
    image_seq_length: 197
    pad_token_id: 0
    image_token_id: 32000
    split: "99,1,0"
    tokenizer:
      tokenizer_type: NullTokenizer
      vocab_size: 50304
hydra:
  run:
    dir: ${oc.env:MEGALENS_GATE_CONTAINER_RUN_DIR}/hydra
